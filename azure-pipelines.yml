###############################################################################
# azure-pipelines.yml
#
# Build & deploy pipeline for the FastAPI application.
#
# Stages:
#   1. Build  - install Python deps into the workspace, zip the artifact
#   2. Deploy - publish the zip to the Linux App Service using AzureWebApp
#
# Prerequisites in Azure DevOps:
#   - A "Service connection" of type "Azure Resource Manager" named
#     'azure-subscription' that has Contributor on the resource group.
#   - Variable group 'partII-vars' with the variables listed below, OR set
#     them as pipeline variables in the UI.
###############################################################################

trigger:
  branches:
    include:
      - main
      - part2
  paths:
    include:
      - app/**
      - requirements.txt
      - azure-pipelines.yml
      - scripts/**

pr: none      # disable on PRs unless explicitly desired

variables:
  - name: pythonVersion
    value: '3.12'
  - name: appServiceName
    value: '$(APP_SERVICE_NAME)'      # set in the variable group / pipeline vars
  - name: resourceGroupName
    value: '$(RESOURCE_GROUP_NAME)'
  - name: azureServiceConnection
    value: 'azure-subscription'
  - name: vmImageName
    value: 'ubuntu-latest'

stages:

# -----------------------------------------------------------------------------
- stage: Build
  displayName: 'Build FastAPI app'
  jobs:
    - job: BuildJob
      displayName: 'Install deps & package'
      pool:
        vmImage: $(vmImageName)
      steps:

        - task: UsePythonVersion@0
          displayName: 'Use Python $(pythonVersion)'
          inputs:
            versionSpec: '$(pythonVersion)'
            addToPath: true

        - script: |
            python -m venv antenv
            source antenv/bin/activate
            python -m pip install --upgrade pip
            pip install -r requirements.txt
          displayName: 'Create venv & install requirements'

        - script: |
            source antenv/bin/activate
            python -c "import app.main; print('import OK, routes:', [r.path for r in app.main.app.routes])" \
              || true   # best-effort: needs env vars at runtime, so import may warn
          displayName: 'Smoke check imports'
          env:
            KEY_VAULT_NAME: 'placeholder'
            STORAGE_ACCOUNT_NAME: 'placeholder'

        - task: ArchiveFiles@2
          displayName: 'Zip application'
          inputs:
            rootFolderOrFile: '$(System.DefaultWorkingDirectory)'
            includeRootFolder: false
            archiveType: 'zip'
            archiveFile: '$(Build.ArtifactStagingDirectory)/app.zip'
            replaceExistingArchive: true
            # exclude things that don't need to ship
            # (Oryx on App Service will rebuild the venv, so we skip antenv)
            # NB: ArchiveFiles@2 has no native exclude; we let Oryx rebuild.

        - publish: '$(Build.ArtifactStagingDirectory)/app.zip'
          displayName: 'Publish artifact'
          artifact: drop

# -----------------------------------------------------------------------------
- stage: Deploy
  displayName: 'Deploy to App Service'
  dependsOn: Build
  condition: succeeded()
  jobs:
    - deployment: DeployJob
      displayName: 'Deploy zip to App Service'
      environment: 'production'
      pool:
        vmImage: $(vmImageName)
      strategy:
        runOnce:
          deploy:
            steps:

              - download: current
                artifact: drop

              - task: AzureWebApp@1
                displayName: 'Deploy FastAPI to $(appServiceName)'
                inputs:
                  azureSubscription: '$(azureServiceConnection)'
                  appType: 'webAppLinux'
                  appName: '$(appServiceName)'
                  resourceGroupName: '$(resourceGroupName)'
                  package: '$(Pipeline.Workspace)/drop/app.zip'
                  runtimeStack: 'PYTHON|$(pythonVersion)'
                  startUpCommand: 'gunicorn -k uvicorn.workers.UvicornWorker -w 2 -b 0.0.0.0:8000 app.main:app'

              - task: AzureCLI@2
                displayName: 'Post-deploy smoke test'
                inputs:
                  azureSubscription: '$(azureServiceConnection)'
                  scriptType: bash
                  scriptLocation: inlineScript
                  inlineScript: |
                    URL="https://$(az webapp show -g $(resourceGroupName) -n $(appServiceName) --query defaultHostName -o tsv)"
                    echo "Probing $URL/healthz ..."
                    for i in {1..12}; do
                      code=$(curl -sk -o /dev/null -w "%{http_code}" "$URL/healthz" || echo "000")
                      echo "  attempt $i -> HTTP $code"
                      if [ "$code" = "200" ]; then
                        echo "App is healthy."
                        exit 0
                      fi
                      sleep 10
                    done
                    echo "App did not become healthy in time."
                    exit 1
